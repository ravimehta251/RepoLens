version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: reposage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reposage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  reposage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reposage-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reposage_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
